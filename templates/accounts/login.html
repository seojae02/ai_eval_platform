{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>로그인</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    {# 로그인 후 돌아갈 주소. Django LoginView가 같은 사이트 주소인지 검사한다(오픈 리다이렉트 방지) #}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">로그인</button>
  </form>
  <p class="helptext">계정이 없나요? <a href="{% url 'signup' %}">참여 코드로 회원가입</a></p>
</section>
{% endblock %}

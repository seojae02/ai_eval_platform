{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>비밀번호 변경</h1>
  {% if user.must_change_password %}
    <p class="notice error">관리자가 발급한 임시 비밀번호로 로그인했습니다. 새 비밀번호로 바꿔야 다른 화면을 쓸 수 있습니다</p>
  {% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">변경</button>
  </form>
</section>
{% endblock %}

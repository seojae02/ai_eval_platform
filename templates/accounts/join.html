{% extends "base.html" %}
{% block title %}대회 추가{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>대회 추가</h1>
  <p class="helptext">새로 받은 참여 코드를 입력하면 그 대회에 참여합니다</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">참여</button>
  </form>
</section>
{% endblock %}

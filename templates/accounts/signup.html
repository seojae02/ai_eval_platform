{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>회원가입</h1>
  <p class="helptext">관리자에게 받은 참여 코드가 있어야 가입할 수 있어요</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">가입</button>
  </form>
  <p class="helptext">이미 계정이 있다면 <a href="{% url 'login' %}">로그인</a> 후 상단의 '대회 추가'에서 코드를 입력하세요</p>
</section>
{% endblock %}
